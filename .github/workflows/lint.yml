name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install Qt 5 headers and the clang tools
      # Pinned versions: a newer clang-tidy brings new checks, which should
      # arrive in a pull request of their own, not fail someone else's.
      run: |
        sudo apt-get update
        sudo apt-get install -y qtbase5-dev
        python -m pip install clang-tidy==22.1.8 clang-format==23.1.3
    - name: Lint
      run: QT_INCLUDE=/usr/include/x86_64-linux-gnu/qt5 sh tools/lint.sh
